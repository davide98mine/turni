<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turni del circolo</title>
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F6F5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turni">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface2:#ECF0EE; --line:#DEE4E1; --border:#CDD5D1;
  --text:#111816; --soft:#404C47; --muted:#66736E; --faint:#9AA6A1;
  --primary:#111816; --onprimary:#F4F6F5; --sel:#E4EAE7;
  --open:#2E7D57; --close:#B8492E; --oncall:#5B47B8; --service:#2F6DB5; --warn:#A86A12; --danger:#C0392B; --leave:#B03E7A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513; --surface:#161E1B; --surface2:#1D2723; --line:#252F2B; --border:#36423D;
    --text:#E9EFEC; --soft:#AAB8B2; --muted:#84938D; --faint:#5A6862;
    --primary:#E9EFEC; --onprimary:#0F1513; --sel:#222D29;
    --open:#7DC4A0; --close:#F0957A; --oncall:#B3A0F2; --service:#8DB6EC; --warn:#EDB15E; --danger:#F07A6E; --leave:#E79AC0;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#161E1B; --surface2:#1D2723; --line:#252F2B; --border:#36423D;
  --text:#E9EFEC; --soft:#AAB8B2; --muted:#84938D; --faint:#5A6862;
  --primary:#E9EFEC; --onprimary:#0F1513; --sel:#222D29;
  --open:#7DC4A0; --close:#F0957A; --oncall:#B3A0F2; --service:#8DB6EC; --warn:#EDB15E; --danger:#F07A6E; --leave:#E79AC0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums;
  padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 24px}
.over{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{margin:4px 0 0;font-size:28px;font-weight:750;letter-spacing:-.03em}
h2{margin:26px 0 6px}
.top{display:flex;align-items:flex-end;gap:8px}
.top .grow{flex:1;min-width:0}
.status{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.live{width:8px;height:8px;border-radius:4px;background:var(--faint)}
.live.on{background:var(--open);box-shadow:0 0 0 0 var(--open);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--open) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.me{height:40px;padding:0 14px;border:1px solid var(--border);border-radius:20px;font-size:13.5px;font-weight:600;color:var(--soft);display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:5px;flex:none;display:inline-block}
.ro{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 10px;border-radius:14px;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:600}
.month{display:flex;align-items:center;margin-top:18px}
.month .name{flex:1;font-size:22px;font-weight:750;letter-spacing:-.02em}
.month .name span{font-size:15px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.round{width:42px;height:42px;border-radius:21px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-left:8px;color:var(--soft)}
.round:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:10px}
.dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:6px}
.cell{min-height:64px;border-top:1px solid var(--line);padding:4px 2px 3px;display:flex;flex-direction:column;gap:3px;border-radius:0;text-align:left}
.cell.sel{background:var(--sel);border-radius:10px;border-top-color:transparent}
.cell .n{display:flex;align-items:center;justify-content:space-between;height:20px;padding:0 2px 0 1px;font-size:12.5px;font-weight:500}
.cell .n b{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;font-weight:500}
.cell.today .n b{background:var(--primary);color:var(--onprimary);font-weight:700}
.cell.we .n b{color:var(--muted)}
.cell.today.we .n b{color:var(--onprimary)}
.cell .sd{width:4px;height:4px;border-radius:2px;background:var(--soft)}
.cell.closed{background:color-mix(in srgb,var(--faint) 16%,transparent)}
.pill{display:block;height:16px;line-height:16px;font-size:10.5px;font-weight:700;text-align:center;border-radius:5px;letter-spacing:.03em;overflow:hidden}
.pill.me{outline:2px solid var(--text);outline-offset:1px}
.tiny{font-size:9.5px;color:var(--muted);text-align:center;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 4px 2px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row.top{align-items:flex-start}
.row .grow{flex:1;min-width:0}
.t1{font-size:15px;font-weight:500}
.t2{font-size:12.5px;color:var(--muted);margin-top:2px}
.right{font-size:13.5px;font-weight:600;color:var(--soft);white-space:nowrap}
.big{font-size:21px;font-weight:750;letter-spacing:-.02em}
.date{width:46px;flex:none}
.date .w{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.date .d{font-size:20px;font-weight:750;letter-spacing:-.02em;margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:12px;border:1px solid var(--border);font-size:12px;color:var(--soft)}
.filter{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--border);font-size:13px;font-weight:500;color:var(--soft);display:flex;align-items:center;gap:6px}
.filter button.on{background:var(--primary);border-color:var(--primary);color:var(--onprimary);font-weight:700}
.tag{font-size:12px;font-weight:700}
.muted{color:var(--muted)}
.closedrow{opacity:.55}
.empty{padding:28px 4px;color:var(--muted);text-align:center}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:13.5px;margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:70px;padding:5px 0;font-size:11.5px;font-weight:500;color:var(--muted)}
nav button.on{color:var(--text);font-weight:700}
nav button .bar{width:16px;height:2px;border-radius:1px;background:transparent;margin-top:2px}
nav button.on .bar{background:var(--text)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));
  z-index:11;display:none;max-width:560px;margin:0 auto;max-height:80vh;overflow:auto}
.sheet.show,.sheet-bg.show{display:block}
.handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:22px;font-weight:750;letter-spacing:-.02em}
.pick{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 12px;border-radius:12px;text-align:left}
.pick.on{background:var(--sel);font-weight:700}
.welcome{padding:40px 4px;text-align:center}
.req{border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:12px}
.req h4{margin:0;font-size:15px;font-weight:700}
.pillst{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700}
.st-attesa{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.st-accettata{color:var(--open);background:color-mix(in srgb,var(--open) 16%,transparent)}
.st-rifiutata{color:var(--danger);background:color-mix(in srgb,var(--danger) 16%,transparent)}
.st-ritirata{color:var(--muted);background:var(--surface2)}
.banner{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13.5px;
  background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--text)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--border);font-size:13.5px;font-weight:500;color:var(--soft)}
.opts button.on{background:var(--primary);border-color:var(--primary);color:var(--onprimary);font-weight:700}
.fl{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.inp{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font:inherit;font-size:15px}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
.msg{margin-top:12px;font-size:13.5px;color:var(--danger);font-weight:600}
.widgetbtn{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;min-height:48px;padding:0 14px;border:1px solid var(--border);border-radius:14px;font-size:14px;font-weight:600;color:var(--soft)}
.seg{display:flex;gap:2px;background:var(--surface2);border-radius:12px;padding:3px;margin:12px 0 6px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--soft)}
.seg button.on{background:var(--primary);color:var(--onprimary)}
.steps{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.5;color:var(--soft)}
.steps li{margin-bottom:8px}
.steps b{color:var(--text)}
.act{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;margin-top:10px;border-radius:14px;font-size:15px;font-weight:700}
.act.fill{background:var(--primary);color:var(--onprimary)}
.act.line{border:1px solid var(--border);color:var(--text)}
.welcome .big{font-size:24px;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<script>
(function () {
  'use strict';
  // ------------------------------------------------------------ dati
  var qs = new URLSearchParams(location.search);
  var DB = (qs.get('db') || '').replace(/\/+$/, '');
  var KEY = qs.get('k') || '';
  var DEMO = window.TM_DEMO === true || qs.get('demo') === '1';
  var STORE = 'tm_view_' + KEY;
  var data = null, live = false, lastErr = '', es = null;
  var tab = 'cal', month = null, selKey = null, filterP = '', me = '';

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  me = store('tm_me') || '';
  try { tab = sessionStorage.getItem('tm_tab') || 'cal'; } catch (e) { }

  var MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  var GG = ['dom','lun','mar','mer','gio','ven','sab'];
  var GGL = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function parse(d) { var p = String(d || '').split('/'); return p.length === 3 ? new Date(+p[2], +p[1] - 1, +p[0]) : null; }
  function key(dt) { return dt.getFullYear() * 10000 + (dt.getMonth() + 1) * 100 + dt.getDate(); }
  function keyOf(d) { var x = parse(d); return x ? key(x) : 0; }
  function fromKey(k) { return new Date(Math.floor(k / 10000), Math.floor(k / 100) % 100 - 1, k % 100); }
  function short(d) { var x = parse(d); return x ? String(x.getDate()).padStart(2, '0') + '/' + String(x.getMonth() + 1).padStart(2, '0') : d; }
  function list(a) { return Array.isArray(a) ? a.filter(Boolean) : (a && typeof a === 'object' ? Object.keys(a).map(function (k) { return a[k]; }) : []); }
  function first(n) { return String(n || '').split(' ')[0]; }
  function initials(n) { var p = String(n || '').trim().split(/\s+/); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase(); }
  function colorOf(n) {
    var ps = list(data && data.people);
    for (var i = 0; i < ps.length; i++) if (ps[i].n === n) return /^#[0-9A-Fa-f]{6}$/.test(ps[i].c) ? ps[i].c : '#8899AA';
    return '#8899AA';
  }
  function soft(hex, a) {   // stesso colore in trasparenza
    var h = String(hex).replace('#', '');
    if (h.length === 8) h = h.slice(2);
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  var TYPE = { A: 'Apertura', C: 'Chiusura', R: 'Reperibilità' };
  var VERB = { A: 'apre', C: 'chiude', R: 'reperibile' };

  // ------------------------------------------------------------ collegamento in tempo reale
  function cached() { try { var s = store(STORE); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function setData(d) {
    if (d === null || typeof d !== 'object') {
      data = null;
      try { localStorage.removeItem(STORE); } catch (e) { }
      lastErr = 'Nessun dato con questo link: forse il responsabile non ha ancora attivato la condivisione, o il link è cambiato.';
      render();
      return;
    }
    lastErr = '';
    data = d;
    try { store(STORE, JSON.stringify(d)); } catch (e) { }
    render();
  }
  function applyAt(path, value) {    // aggiornamento parziale (patch) dal database
    if (!path || path === '/') return setData(value);
    var parts = path.split('/').filter(Boolean), o = data || {};
    data = o;
    for (var i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
    if (value === null) delete o[parts[parts.length - 1]]; else o[parts[parts.length - 1]] = value;
    setData(data);
  }
  function connect() {
    var url = DB + '/condivisi/' + encodeURIComponent(KEY) + '.json';
    if (window.EventSource) {
      if (es) try { es.close(); } catch (e) { }
      es = new EventSource(url);
      es.addEventListener('put', function (ev) { var m = JSON.parse(ev.data); live = true; lastErr = ''; applyAt(m.path, m.data); });
      es.addEventListener('patch', function (ev) {
        var m = JSON.parse(ev.data);
        Object.keys(m.data || {}).forEach(function (k) { applyAt((m.path === '/' ? '' : m.path) + '/' + k, m.data[k]); });
      });
      es.addEventListener('cancel', function () { es.close(); live = false; lastErr = 'Il link non è più valido: chiedi quello nuovo al responsabile'; render(); });
      es.addEventListener('auth_revoked', function () { live = false; render(); });
      es.onopen = function () { live = true; render(); };
      es.onerror = function () {
        live = false;
        // se il browser ha chiuso del tutto il collegamento (errore del server) riproviamo noi tra 30 secondi
        if (es.readyState === 2) { if (!lastErr) lastErr = 'Collegamento interrotto, riprovo tra poco…'; setTimeout(connect, 30000); }
        render();
      };
    } else {
      var poll = function () {
        fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) { live = true; setData(d); })
          .catch(function () { live = false; render(); });
      };
      poll();
      setInterval(poll, 30000);
    }
  }

  // ------------------------------------------------------------ calcoli
  function shiftsOn(k) { return list(data.shifts).filter(function (s) { return keyOf(s.d) === k; }).sort(function (a, b) { return 'ACR'.indexOf(a.t) - 'ACR'.indexOf(b.t); }); }
  function servicesOn(k) { return list(data.services).filter(function (s) { var a = keyOf(s.d), b = s.e ? keyOf(s.e) : a; return k >= a && k <= b; }); }
  function leavesOn(k) { return list(data.leaves).filter(function (l) { var a = keyOf(l.f), b = l.t ? keyOf(l.t) : a; return k >= a && k <= b; }); }
  function dayInfo(k) { var r = null; list(data.days).forEach(function (d) { if (keyOf(d.d) === k) r = d; }); return r; }
  function presenceOn(k) { var r = null; list(data.presence).forEach(function (d) { if (keyOf(d.d) === k) r = d; }); return r; }
  function monthRange() {
    var f = parse(data.from), t = parse(data.to);
    return { from: f ? new Date(f.getFullYear(), f.getMonth(), 1) : null, to: t ? new Date(t.getFullYear(), t.getMonth(), 1) : null };
  }
  function ago(ms) {
    if (!ms) return '';
    var d = new Date(ms), now = new Date();
    var t = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    if (key(d) === key(now)) return 'oggi alle ' + t;
    var y = new Date(now); y.setDate(y.getDate() - 1);
    if (key(d) === key(y)) return 'ieri alle ' + t;
    return d.getDate() + ' ' + MESI[d.getMonth()] + ' alle ' + t;
  }

  // ------------------------------------------------------------ pezzi grafici
  function pill(s) {
    var c = colorOf(s.p), cls = 'pill' + (me && s.p === me ? ' me' : ''), st;
    if (s.t === 'C') st = 'color:' + c + ';box-shadow:inset 0 0 0 1.2px ' + c;
    else if (s.t === 'R') st = 'color:var(--bg);background:' + c;
    else st = 'color:' + c + ';background:' + soft(c, .2);
    return '<span class="' + cls + '" style="' + st + '">' + esc(initials(s.p)) + '</span>';
  }
  function dot(n, size) { size = size || 9; return '<span class="dot" style="width:' + size + 'px;height:' + size + 'px;background:' + colorOf(n) + '"></span>'; }
  function monthBar() {
    var r = monthRange(), prevOk = !r.from || month > r.from, nextOk = !r.to || month < r.to;
    return '<div class="month"><div class="name">' + cap(MESI[month.getMonth()]) + '<span>' + month.getFullYear() + '</span></div>' +
      '<button class="round" data-m="-1" aria-label="Mese precedente"' + (prevOk ? '' : ' disabled') + '><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>' +
      '<button class="round" data-m="1" aria-label="Mese successivo"' + (nextOk ? '' : ' disabled') + '><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button></div>';
  }
  function personFilter() {
    var h = '<div class="filter"><button data-f=""' + (filterP ? '' : ' class="on"') + '>Tutti</button>';
    list(data.people).forEach(function (p) {
      h += '<button data-f="' + esc(p.n) + '"' + (filterP === p.n ? ' class="on"' : '') + '>' + dot(p.n, 8) + esc(first(p.n)) + '</button>';
    });
    return h + '</div>';
  }

  // ------------------------------------------------------------ sezioni
  function calendar() {
    var y = month.getFullYear(), m = month.getMonth();
    var firstDow = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate(), today = key(new Date());
    var svc = {};
    list(data.services).forEach(function (s) {
      if (filterP && s.p !== filterP) return;
      var x = parse(s.d), end = s.e ? keyOf(s.e) : keyOf(s.d);
      // giorno per giorno con setDate (non +24 ore: con il cambio dell'ora un giorno può durarne 23 o 25)
      for (var g = 0; x && key(x) <= end && g < 62; g++) { svc[key(x)] = 1; x.setDate(x.getDate() + 1); }
    });

    h += '<div class="fl">Nota (facoltativa)</div><textarea class="inp" id="rn" rows="2" maxlength="400" placeholder="Es. visita medica, matrimonio…">' + esc(form.nota) + '</textarea>';
    var rej = form.f && form.t ? myReqs.filter(function (x) { return x.stato === 'rifiutata' && overlapR(x, { f: isoToDmy(form.f), t: isoToDmy(form.t) }); }).length : 0;
    if (rej === 1) h += '<div class="banner">Per questi giorni una richiesta è già stata rifiutata: puoi riproporla una sola volta.</div>';
    if (form.msg) h += '<div class="msg">' + esc(form.msg) + '</div>';
    h += '<button class="act fill" id="sendReq">Invia richiesta</button>';
    openSheet(h);
    ['rf', 'rt', 'rn'].forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener('change', function () {
        form.f = document.getElementById('rf').value; form.t = document.getElementById('rt').value; form.nota = document.getElementById('rn').value;
        if (id === 'rf' && form.f && (!form.t || form.t < form.f)) { form.t = form.f; document.getElementById('rt').value = form.t; }
      });
    });
  }
  function isoToDmy(v) { var p = String(v || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }
  function sendRequest(btn) {
    if (reqBusy) return;
    form.f = document.getElementById('rf').value; form.t = document.getElementById('rt').value; form.nota = document.getElementById('rn').value.trim();
    var r = { p: me, ty: form.ty, u: form.u, f: isoToDmy(form.f), t: isoToDmy(form.t || form.f) };
    var err = checkRequest(r);
    if (err) { form.msg = err; requestSheet(); return; }
    reqBusy = true; btn.textContent = 'Invio…';
    authToken().then(function (a) {
      var body = { uid: a.uid, p: r.p, ty: r.ty, u: r.u, f: r.f, t: r.t, stato: 'attesa', creata: { '.sv': 'timestamp' } };
      if (form.nota) body.nota = form.nota.slice(0, 400);
      return fetch(reqUrl('', a), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }).then(function (res) {
      reqBusy = false;
      if (!res.ok) throw new Error(res.status);
      form = { ty: form.ty, u: form.u, f: '', t: '', nota: '', msg: '' };
      closeSheet();
      loadMyRequests();
      openSheet('<h3>Richiesta inviata</h3><div class="t2">Il responsabile la vedrà nella sua app. Finché non risponde la trovi «In verifica» nella sezione Licenze.</div>' +
        '<button class="act fill" id="sheetOk">Ok</button>');
    }).catch(function (e) {
      reqBusy = false;
      form.msg = 'Invio non riuscito. Controlla la connessione e riprova. Se il problema continua, avvisa il responsabile (richieste non attive).';
      requestSheet();
    });
  }
  function withdrawRequest(id, btn) {
    btn.textContent = 'Ritiro…';
    authToken().then(function (a) {
      return fetch(reqUrl('/' + encodeURIComponent(id), a), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ stato: 'ritirata' }) });
    }).then(function (r) { if (!r.ok) throw new Error(r.status); loadMyRequests(); })
      .catch(function () { btn.textContent = 'Non riuscito: riprova'; });
  }

  // ------------------------------------------------------------ widget per la schermata Home
  function myLink() { return location.href.split('#')[0]; }
  function widgetSheet(os) {
    var h = '<h3>Widget</h3><div class="t2">Aperture, chiusure e reperibilità di oggi e dei prossimi giorni, sempre in vista sulla schermata Home.</div>' +
      '<div class="seg"><button data-os="ios"' + (os === 'ios' ? ' class="on"' : '') + '>iPhone</button><button data-os="android"' + (os === 'android' ? ' class="on"' : '') + '>Android</button></div>';
    if (os === 'ios') {
      h += '<ol class="steps">' +
        '<li>Scarica dall\'App Store l\'app gratuita <b>Scriptable</b>.</li>' +
        '<li>Tocca qui sotto <b>Copia il codice</b>. Apri Scriptable, tocca <b>+</b> in alto, incolla e tocca <b>Fine</b>. Se vuoi, rinomina lo script «Turni».</li>' +
        '<li>Tocca <b>Copia il mio link</b>.</li>' +
        '<li>Sulla schermata Home tieni premuto uno spazio vuoto → <b>+</b> (o <b>Modifica</b> → <b>Aggiungi widget</b>) → <b>Scriptable</b> → scegli la misura media → <b>Aggiungi widget</b>.</li>' +
        '<li>Tieni premuto il widget → <b>Modifica widget</b>: in <b>Script</b> scegli «Turni», in <b>Parameter</b> incolla il link. Fatto.</li>' +
        '<li>Facoltativo: in <b>Parameter</b>, dopo il link, aggiungi uno spazio e <b>domani</b> per vedere domani e dopodomani invece di oggi e domani; ' +
        'aggiungi <b>aperture</b>, <b>chiusure</b> o <b>reperibilità</b> per vedere solo quelle. Esempio: <i>…link… domani aperture</i></li></ol>' +
        '<button class="act fill" data-copy="code">Copia il codice</button><button class="act line" data-copy="link">Copia il mio link</button>' +
        '<div class="t2" style="margin-top:12px">Il widget si aggiorna da solo circa ogni mezz\'ora; toccandolo si apre questa pagina.</div>';
    } else {
      h += '<ol class="steps">' +
        '<li>Installa l\'app <b>Turni Circolo</b> che ti manda il responsabile oppure scaricala dal pulsante qui sotto. Se Android lo chiede, consenti l\'installazione da questa fonte.</li>' +
        '<li>Tocca qui sotto <b>Copia il mio link</b>, apri Turni Circolo e tocca <b>Incolla il link copiato</b> → <b>Salva e apri</b>.</li>' +
        '<li>Sulla schermata Home tieni premuto uno spazio vuoto → <b>Widget</b> → <b>Turni Circolo</b> e trascinalo dove vuoi. Puoi allargarlo per vedere i giorni per intero.</li>' +
        '<li>Si apre <b>Impostazioni widget</b>: scegli <b>oggi e domani</b> o <b>domani e dopodomani</b> e cosa mostrare (aperture, chiusure, reperibilità). ' +
        'Per cambiarle dopo: tieni premuto il widget, oppure tieni premuta l\'icona di Turni Circolo → «Impostazioni widget».</li></ol>' +
        '<button class="act fill" data-copy="link">Copia il mio link</button>' +
        '<a class="act line" href="TurniCircolo.apk" download style="text-decoration:none">Scarica Turni Circolo (Android)</a>' +
        '<div class="t2" style="margin-top:12px">L\'app mostra anche questa pagina e tiene aggiornato il widget (ogni mezz\'ora e ogni volta che la apri).</div>';
    }
    openSheet(h);
    // il codice si prepara subito: su iPhone si può copiare solo nello stesso tocco, senza attese
    if (os === 'ios' && !widgetCode) fetch('widget-iphone.js', { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (t) { widgetCode = t; }).catch(function () { });
  }
  var widgetCode = '';
  function copyThing(what, btn) {
    var done = function () { var old = btn.textContent; btn.textContent = 'Copiato ✓'; setTimeout(function () { btn.textContent = old; }, 1800); };
    var fail = function () { btn.textContent = 'Non riesco a copiare: tieni premuto e copia a mano'; };
    var write = function (text) {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
      else fail();
    };
    if (what === 'link') write(myLink());
    else if (widgetCode) write(widgetCode);
    else btn.textContent = 'Un attimo, riprova tra un secondo';
  }

  function openSheet(html) {
    var s = document.getElementById('sheet'), b = document.getElementById('sheetBg');
    s.innerHTML = '<div class="handle"></div>' + html;
    s.classList.add('show'); b.classList.add('show');
  }
  function closeSheet() { document.getElementById('sheet').classList.remove('show'); document.getElementById('sheetBg').classList.remove('show'); }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button, #sheetBg');
    if (!t) return;
    if (t.id === 'sheetBg') return closeSheet();
    if (t.dataset.tab) { tab = t.dataset.tab; filterP = ''; try { sessionStorage.setItem('tm_tab', tab); } catch (e) { } render(); window.scrollTo(0, 0); return; }
    if (t.dataset.m) { month = new Date(month.getFullYear(), month.getMonth() + (+t.dataset.m), 1); selKey = null; render(); return; }
    if (t.dataset.day) { selKey = +t.dataset.day; render(); return; }
    if (t.dataset.f !== undefined) { filterP = t.dataset.f; render(); return; }
    if (t.id === 'meBtn') {
      var h = '<h3>Chi sei?</h3><div class="t2" style="margin-bottom:12px">I tuoi turni saranno evidenziati nel calendario e vedrai i tuoi prossimi impegni. Resta solo su questo telefono.</div>';
      list(data.people).forEach(function (p) { h += '<button class="pick' + (me === p.n ? ' on' : '') + '" data-me="' + esc(p.n) + '">' + dot(p.n, 10) + esc(p.n) + '</button>'; });
      h += '<button class="pick" data-me="">Nessuno</button>';
      openSheet(h);
      return;
    }
    if (t.dataset.me !== undefined) { me = t.dataset.me; store('tm_me', me); myReqs = []; closeSheet(); render(); loadMyRequests(); }
    if (t.id === 'askBtn') { if (!me) { document.getElementById('meBtn').click(); return; } requestSheet(); return; }
    if (t.dataset.rty !== undefined) { form.ty = t.dataset.rty; requestSheet(); return; }
    if (t.dataset.ru !== undefined) { form.u = t.dataset.ru; requestSheet(); return; }
    if (t.id === 'sendReq') { sendRequest(t); return; }
    if (t.dataset.withdraw) { withdrawRequest(t.dataset.withdraw, t); return; }
    if (t.id === 'sheetOk') { closeSheet(); render(); return; }
    if (t.id === 'widgetBtn') { widgetSheet(/iPhone|iPad|iPod/.test(navigator.userAgent) ? 'ios' : 'android'); return; }
    if (t.dataset.os) { widgetSheet(t.dataset.os); return; }
    if (t.dataset.copy) { copyThing(t.dataset.copy, t); return; }
  });

  // ------------------------------------------------------------ avvio
  if (DEMO && window.TM_DEMO_DATA) { data = window.TM_DEMO_DATA; live = true; render(); }
  else if (DB && KEY) {
    data = cached(); render(); connect();
    setTimeout(loadMyRequests, 1500);
    setInterval(function () { if (!document.hidden) loadMyRequests(); }, 60000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) loadMyRequests(); });
  }
  else render();
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !DEMO) navigator.serviceWorker.register('sw.js').catch(function () { });
})();
</script>
</body>
</html>
